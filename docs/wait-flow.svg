<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">Wait operation flow</title><desc id="desc">Decision flow for waiting on a child process and reaping a zombie.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><style>.box{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.decision{fill:#f8fafc;stroke:#334155;stroke-width:2}.result{fill:#f0fdf4;stroke:#16a34a;stroke-width:2}.error{fill:#fef2f2;stroke:#dc2626;stroke-width:2}.t{font:15px Arial,sans-serif;fill:#0f172a;text-anchor:middle}.label{font:13px Arial,sans-serif;fill:#475569}.l{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="920" height="560" rx="16" fill="#fff"/>
  <rect class="box" x="350" y="25" width="220" height="55" rx="28"/><text class="t" x="460" y="59">pm_wait(parent, child)</text>
  <path class="decision" d="M460 110 L590 165 L460 220 L330 165 Z"/><text class="t" x="460" y="160">Parent exists and</text><text class="t" x="460" y="179">is alive?</text>
  <rect class="error" x="700" y="137" width="145" height="55" rx="8"/><text class="t" x="772" y="171">Return -1</text>
  <path class="decision" d="M460 245 L590 300 L460 355 L330 300 Z"/><text class="t" x="460" y="306">Matching child exists?</text>
  <rect class="result" x="700" y="272" width="145" height="55" rx="8"/><text class="t" x="772" y="306">Return 0</text>
  <path class="decision" d="M460 380 L590 435 L460 490 L330 435 Z"/><text class="t" x="460" y="441">Zombie available?</text>
  <rect class="result" x="670" y="407" width="200" height="55" rx="8"/><text class="t" x="770" y="430">Reap child and return</text><text class="t" x="770" y="449">its exit status</text>
  <rect class="box" x="75" y="407" width="200" height="55" rx="8"/><text class="t" x="175" y="430">Mark parent blocked</text><text class="t" x="175" y="449">and wait for signal</text>
  <path class="l" d="M460 80 V110"/><path class="l" d="M590 165 H700"/><text class="label" x="630" y="154">No</text>
  <path class="l" d="M460 220 V245"/><text class="label" x="472" y="238">Yes</text>
  <path class="l" d="M590 300 H700"/><text class="label" x="630" y="289">No</text>
  <path class="l" d="M460 355 V380"/><text class="label" x="472" y="373">Yes</text>
  <path class="l" d="M590 435 H670"/><text class="label" x="618" y="424">Yes</text>
  <path class="l" d="M330 435 H275"/><text class="label" x="298" y="424">No</text>
  <path class="l" d="M175 407 V165 H330"/><text class="label" x="187" y="284">Wake and retry</text>
</svg>
